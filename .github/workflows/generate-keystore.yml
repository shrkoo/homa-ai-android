.github/workflows/generate-keystore.ymlname: Generate Homa AI Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          PASSWORD=$(openssl rand -hex 24)

          keytool -genkeypair \
            -v \
            -keystore homa-ai-release.jks \
            -alias homa-ai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Homa AI, OU=Homa AI, O=Homa AI, L=Unknown, ST=Unknown, C=US"

          echo "KEYSTORE_PASSWORD=$PASSWORD" > keystore-info.txt
          echo "KEY_ALIAS=homa-ai" >> keystore-info.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: homa-ai-keystore
          path: |
            homa-ai-release.jks
            keystore-info.txt
