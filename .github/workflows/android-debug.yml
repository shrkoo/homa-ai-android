name: Android Debug Build

on:
  push:
    branches: [build-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleGoogleplayDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: homa-ai-debug-apk
          path: app/build/outputs/apk/googleplay/debug/*.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-${{ github.run_number }}" app/build/outputs/apk/googleplay/debug/*.apk --title "Homa AI debug build ${{ github.run_number }}" --notes "Debug APK (ai.homa.app.debug) with push notifications" --prerelease
