name: Build Homa AI Android

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Target market'
        required: true
        default: googleplay
        type: choice
        options: [googleplay, myket, bazaar]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3

      - name: Create keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > homa-ai-release.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assemble${{ inputs.market || 'googleplay' }}Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Homa-AI-${{ inputs.market || 'googleplay' }}-apk
          path: app/build/outputs/apk/**/*.apk
