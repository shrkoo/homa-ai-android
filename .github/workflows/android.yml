name: Build Homa AI Android
on:
  workflow_dispatch:
    inputs:
      market:
        description: Target market
        required: true
        default: googleplay
        type: choice
        options: [googleplay, myket, bazaar]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homa-release.jks"
      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/homa-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MARKET: ${{ inputs.market }}
        run: |
          variant="${MARKET^}"
          gradle --no-daemon assemble${variant}Release bundle${variant}Release
      - name: Verify signatures and prepare downloads
        env:
          MARKET: ${{ inputs.market }}
        run: |
          set -e
          mkdir -p release
          apk=$(find app/build/outputs/apk -name '*release.apk' -print -quit)
          aab=$(find app/build/outputs/bundle -name '*.aab' -print -quit)
          test -n "$apk" && test -n "$aab"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify "$apk"
          jarsigner -verify "$aab"
          cp "$apk" "release/homa-ai-2.0.2-$MARKET.apk"
          cp "$aab" "release/homa-ai-2.0.2-$MARKET.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: Homa-AI-2.0.2-${{ inputs.market }}-signed
          path: release/*
          if-no-files-found: error
      - name: Publish download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.2 >/dev/null 2>&1 || gh release create v2.0.2 --target "$GITHUB_SHA" --title "Homa AI 2.0.2" --notes "Signed APK and AAB; Independent authenticated chat, private uploads, and payment proof collection. Independent manual payment approval and alerts; safe space above Android navigation buttons."
          gh release upload v2.0.2 release/* --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/homa-release.jks"
